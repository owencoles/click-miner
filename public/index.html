<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Miner</title>

  <!-- App icon. favicon.ico carries 16/32/48/64 for browsers and OS chrome
       that still ask for it; the PNGs cover modern browsers, Android home
       screens and PWA installs; apple-touch-icon is the opaque square
       variant because iOS applies its own corner mask. -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#fa6402" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="marquee-bar">
    <div class="marquee-track" id="marquee-track">
      <span id="marquee-text"></span>
    </div>
  </div>

  <header class="banner">
    <div class="banner-inner">
      <h1 class="title" id="banner-title"></h1>
      <p class="tagline" id="banner-tagline"></p>
    </div>
  </header>

  <div class="status-strip">
    <span class="led" id="status-led"></span>
    <span id="status-text"></span>
  </div>

  <nav class="tab-bar" id="tab-bar">
    <button type="button" class="tab-btn active" data-tab="mine" id="tab-btn-mine"></button>
    <button type="button" class="tab-btn" data-tab="settings" id="tab-btn-settings"></button>
    <button type="button" class="tab-btn" data-tab="learn" id="tab-btn-learn"></button>
  </nav>

  <main class="page">

    <!-- ============================= MINE TAB ============================= -->
    <div class="tab-panel" id="tab-mine" data-tab-panel="mine">

      <section class="window mine-spotlight">
        <div class="hashes-submitted" id="hashes-submitted"></div>
        <div class="window-body mine-body">
          <div class="mine-controls">
            <button type="button" class="btn btn-huge" id="mine-button"></button>
            <label class="autoclick-toggle">
              <input type="checkbox" id="autoclick-checkbox" />
              <span id="autoclick-label"></span>
            </label>
          </div>

          <div class="target-bar-wrap">
            <div class="field-label" id="target-bar-label"></div>
            <div class="target-bar">
              <div class="target-bar-fill" id="target-bar-fill" style="width: 0%"></div>
            </div>
            <div class="target-bar-caption" id="target-bar-caption"></div>
          </div>

          <div class="last-hash-wrap">
            <div class="field-label" id="last-hash-label"></div>
            <div class="hex last-hash" id="last-hash">--</div>
          </div>

          <div id="success-banner" class="success-banner hidden">
            <div class="success-banner-inner">
              <div class="success-title" id="success-title"></div>
              <div id="success-detail"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="window" id="header-window">
        <div class="window-titlebar"><span><span id="header-window-title-prefix"></span><span id="field-height">--</span></span></div>
        <div class="window-body">
          <table class="field-table">
            <tbody>
              <tr>
                <th id="label-version"></th>
                <td class="hex" id="field-version">--</td>
                <td class="field-help" id="help-version"></td>
              </tr>
              <tr>
                <th id="label-prevhash"></th>
                <td class="hex" id="field-prevhash">--</td>
                <td class="field-help" id="help-prevhash"></td>
              </tr>
              <tr>
                <th id="label-merkleroot"></th>
                <td class="hex" id="field-merkleroot">--</td>
                <td class="field-help" id="help-merkleroot"></td>
              </tr>
              <tr>
                <th id="label-time"></th>
                <td class="hex" id="field-time">--</td>
                <td class="field-help" id="help-time"></td>
              </tr>
              <tr>
                <th id="label-bits"></th>
                <td class="hex" id="field-bits">--</td>
                <td class="field-help" id="help-bits"></td>
              </tr>
              <tr>
                <th id="label-nonce"></th>
                <td>
                  <input type="number" class="nonce-input" id="field-nonce" min="0" max="4294967295" step="1" value="0" />
                </td>
                <td class="field-help" id="help-nonce"></td>
              </tr>
              <tr>
                <th id="label-coinbase"></th>
                <td class="hex" id="field-coinbase-value">--</td>
                <td class="field-help" id="help-coinbase"></td>
              </tr>
            </tbody>
          </table>

          <div class="header-hex-wrap">
            <div class="field-label" id="header-hex-label"></div>
            <div class="hex header-hex" id="field-header-hex">--</div>
          </div>

          <div class="button-row">
            <button type="button" class="btn" id="refresh-button"></button>
            <span id="candidate-message" class="inline-message"></span>
          </div>
        </div>
      </section>

      <section class="window" id="log-window">
        <div class="window-titlebar"><span id="log-window-title"></span></div>
        <div class="window-body">
          <div class="log-screen" id="log-screen"></div>
        </div>
      </section>

      <section class="window" id="hashrate-window">
        <div class="window-titlebar"><span id="hashrate-window-title"></span></div>
        <div class="window-body">
          <div class="log-screen" id="hashrate-share-caption"></div>
        </div>
      </section>

    </div>

    <!-- =========================== SETTINGS TAB =========================== -->
    <div class="tab-panel hidden" id="tab-settings" data-tab-panel="settings">

      <section class="window" id="settings-window">
        <div class="window-titlebar"><span id="settings-window-title"></span></div>
        <div class="window-body" id="settings-body">
          <p class="help-text" id="settings-intro"></p>
          <form id="settings-form">
            <fieldset>
              <legend id="rpc-legend"></legend>
              <label><span id="host-label"></span> <input type="text" name="host" id="input-host" /></label>
              <label><span id="port-label"></span> <input type="number" name="port" id="input-port" /></label>
              <label><span id="username-label"></span> <input type="text" name="username" id="input-username" autocomplete="off" /></label>
              <label><span id="password-label"></span> <input type="password" name="password" id="input-password" autocomplete="off" /></label>
              <p class="help-text small" id="cookie-note" hidden></p>
            </fieldset>
            <fieldset>
              <legend id="payout-legend"></legend>
              <label><span id="payout-label"></span>
                <input type="text" name="payoutAddress" id="input-payout-address" autocomplete="off" />
              </label>
              <p class="help-text small" id="payout-help"></p>
            </fieldset>
            <div class="button-row">
              <button type="submit" class="btn" id="save-settings-button"></button>
              <span id="settings-message" class="inline-message"></span>
            </div>
          </form>
        </div>
      </section>

    </div>

    <!-- ============================= LEARN TAB ============================= -->
    <div class="tab-panel hidden" id="tab-learn" data-tab-panel="learn">

      <section class="window" id="learn-window">
        <div class="window-titlebar"><span id="learn-window-title"></span></div>
        <div class="window-body learn-body" id="learn-body"></div>
      </section>

    </div>

  </main>

  <footer class="page-footer">
    <p><a href="https://github.com/owencoles/Click-Miner" target="_blank" rel="noopener noreferrer" id="footer-github-link"></a></p>
    <p><a href="#" id="footer-lightning-link"></a></p>
  </footer>

  <div class="modal-overlay hidden" id="lightning-modal">
    <div class="window modal-window">
      <div class="window-titlebar">
        <span id="lightning-modal-title"></span>
        <button type="button" class="modal-close" id="lightning-modal-close" aria-label="Close">✕</button>
      </div>
      <div class="window-body lightning-modal-body">
        <p class="help-text small" id="lightning-modal-caption"></p>
        <div class="lightning-qr" id="lightning-qr"></div>
        <div class="lightning-address-row">
          <code class="lightning-address" id="lightning-address-text"></code>
          <button type="button" class="btn" id="lightning-copy-button"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="qrcode.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
