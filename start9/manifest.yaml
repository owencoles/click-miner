# Start9 / StartOS service manifest.
#
# CONFIDENCE NOTE: the top-level fields below (id, title, version, license,
# main/docker config, health-checks, interfaces) are verified against a
# real shipped StartOS package (Start9Labs/bitcoin-core-startos) as of
# 2026-08. The `dependencies` block is NOT verified to the same standard —
# StartOS's mechanism for a dependent service to obtain a bitcoind RPC
# host/port/credentials at runtime (config rules, auto-configure, rpcauth
# registration via actions) is materially more involved than Umbrel's
# static env-var injection, several real example repos I tried to check
# for a working reference (bwt-wrapper, thunderhub-startos) returned 404
# during research, and StartOS's own dependency-spec docs page stops short
# of documenting the runtime access API. Treat the `dependencies` section
# below as a placeholder shape, not a working implementation — verify
# against the current start-sdk docs and a real dependent-service example
# before actually packaging this for StartOS.

id: click-miner
title: Click Miner
version: 0.1.0
release-notes: Initial release.
license: MIT
wrapper-repo: "https://github.com/owencoles/Click-Miner"
upstream-repo: "https://github.com/owencoles/Click-Miner"
support-site: "https://github.com/owencoles/Click-Miner/issues"
marketing-site: "https://github.com/owencoles/Click-Miner"
description:
  short: A free, open-source, educational manual Bitcoin miner.
  long: >
    Click a button and the app assembles one real block header from your
    own node's live data, computes a single SHA256d hash against the
    current network target, and shows you exactly what mining does — one
    hash at a time. Reward payout on the (nearly impossible) chance you
    find a block goes to your own configured address.
assets:
  license: LICENSE
  icon: icon.png
  instructions: ""
main:
  type: docker
  image: main
  # Must go through docker-entrypoint.sh, not straight to node: the
  # entrypoint starts the bundled Tor client, without which a .onion RPC
  # host can't be resolved at all.
  entrypoint: "docker-entrypoint.sh"
  args: []
  mounts:
    main: /data
  env:
    PORT: "3000"
    DATA_DIR: /data
    # All interfaces within the container — StartOS reaches it over its
    # own network, and its interface layer is what actually exposes the
    # UI. A loopback bind here would make the container unreachable.
    HOST: "0.0.0.0"
health-checks: {}
interfaces:
  main:
    name: Click Miner Web UI
    description: The Click Miner web interface.
    tor-config:
      port-mapping:
        80: "3000"
    lan-config:
      443:
        ssl: true
        internal: 3000
    ui: true
    protocols:
      - tcp
      - http
hardware-requirements:
  arch:
    - x86_64
    - aarch64
# TODO (unverified — see note at top of file): declare the dependency on
# StartOS's bitcoind package and how RPC_HOST/RPC_PORT/RPC_USER/
# RPC_PASSWORD (server/settings.js's expected env vars) actually get
# populated from it at runtime.
dependencies:
  bitcoind:
    version: ">=24.0.0 <31.0.0"
    requirement:
      type: required
    description: Click Miner needs your own Bitcoin node's RPC interface to fetch block templates and submit blocks.
